apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-api
  labels:
    {{- include "accounts-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: accounts-api
  template:
    metadata:
      labels:
        app: accounts-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          command:
            - sh
            - -c
            - >
              until pg_isready -h postgres -p {{ .Values.postgres.service.port }} -U {{ .Values.postgres.username }}; do
                echo waiting for postgres...;
                sleep 2;
              done
      containers:
        - name: accounts-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.containerPort }}
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/accounts
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/accounts
              port: {{ .Values.api.containerPort }}
            initialDelaySeconds: 20
            periodSeconds: 15
